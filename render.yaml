services:
  - type: web
    name: blog-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://blog-frontend.onrender.com

  # Static site configuration:
  - type: static
    name: blog-frontend
    buildCommand: npm ci && npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: blog-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
